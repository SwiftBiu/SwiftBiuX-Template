<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Downloader</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    * { box-sizing: border-box; }
    html { background: transparent; }
    body { margin: 0; min-height: 100vh; background: color-mix(in srgb, Canvas 94%, transparent); color: CanvasText; }
    main { padding: 18px; }
    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, AccentColor 18%, transparent); font-size: 20px; }
    h1 { font-size: 17px; margin: 0; }
    .sub { margin-top: 2px; opacity: .62; font-size: 12px; }
    .card { border: 1px solid color-mix(in srgb, CanvasText 13%, transparent); border-radius: 14px; padding: 13px; background: color-mix(in srgb, Canvas 82%, transparent); margin-top: 10px; }
    .label { font-size: 11px; opacity: .55; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
    .url { font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .spinner { width: 15px; height: 15px; border: 2px solid color-mix(in srgb, CanvasText 18%, transparent); border-top-color: AccentColor; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #d84a4a; font-size: 12px; line-height: 1.45; white-space: pre-wrap; }
    .meta { display: grid; grid-template-columns: 76px 1fr; gap: 7px 9px; font-size: 12px; }
    .meta .k { opacity: .55; }
    .meta .v { overflow-wrap: anywhere; }
    .formats { display: grid; gap: 8px; margin-top: 8px; }
    .format { width: 100%; border: 1px solid color-mix(in srgb, CanvasText 13%, transparent); border-radius: 12px; padding: 10px 11px; background: color-mix(in srgb, Canvas 88%, transparent); color: inherit; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .format:hover { border-color: color-mix(in srgb, AccentColor 55%, transparent); background: color-mix(in srgb, AccentColor 8%, Canvas); }
    .format.selected { border-color: AccentColor; background: color-mix(in srgb, AccentColor 11%, Canvas); }
    .format-title { font-size: 13px; font-weight: 600; }
    .format-detail { margin-top: 3px; font-size: 11px; opacity: .58; }
    .badge { font-size: 10px; padding: 4px 7px; border-radius: 999px; background: color-mix(in srgb, CanvasText 8%, transparent); white-space: nowrap; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button.primary, button.secondary { border: 0; border-radius: 10px; height: 34px; padding: 0 13px; font: inherit; cursor: pointer; }
    button.primary { background: AccentColor; color: white; flex: 1; font-weight: 600; }
    button.secondary { background: color-mix(in srgb, CanvasText 9%, transparent); color: inherit; }
    button:disabled { opacity: .45; cursor: default; }
    .progress { height: 6px; background: color-mix(in srgb, CanvasText 10%, transparent); border-radius: 999px; overflow: hidden; margin-top: 10px; }
    .progress > div { height: 100%; width: 35%; background: AccentColor; border-radius: inherit; animation: pulse 1.1s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: translateX(-70%); } to { transform: translateX(230%); } }
    .foot { margin-top: 12px; font-size: 10px; line-height: 1.4; opacity: .48; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="header">
    <div class="icon">↓</div>
    <div>
      <h1 id="title">Media Downloader</h1>
      <div class="sub" id="subtitle">Third-party resolver client</div>
    </div>
  </div>

  <div class="card">
    <div class="label" id="sourceLabel">Selected URL</div>
    <div class="url" id="sourceURL">—</div>
  </div>

  <div class="card" id="statusCard">
    <div class="status"><div class="spinner"></div><span id="statusText">Loading configuration…</span></div>
  </div>

  <div class="card" id="errorCard" hidden>
    <div class="error" id="errorText"></div>
  </div>

  <div id="resultArea" hidden>
    <div class="card">
      <div class="meta">
        <div class="k" id="nameLabel">Title</div><div class="v" id="mediaTitle">—</div>
        <div class="k" id="platformLabel">Platform</div><div class="v" id="platform">—</div>
        <div class="k" id="authorLabel">Author</div><div class="v" id="author">—</div>
      </div>
    </div>

    <div class="card">
      <div class="label" id="formatLabel">Available formats</div>
      <div class="formats" id="formats"></div>
      <div class="actions">
        <button class="secondary" id="folderButton">Folder…</button>
        <button class="primary" id="downloadButton" disabled>Download</button>
      </div>
      <div class="progress" id="downloadProgress" hidden><div></div></div>
    </div>
  </div>

  <div class="foot" id="footnote">This extension does not parse media sites itself. The selected URL is sent to the third-party resolver configured by the user.</div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let inputURL = "";
  let selectedFormat = null;
  let downloadDirectory = "";
  let locale = "en";

  const strings = {
    en: {
      subtitle: "Third-party resolver client", source: "Selected URL", loading: "Loading configuration…",
      resolving: "Resolving with third-party API…", title: "Title", platform: "Platform", author: "Author",
      formats: "Available formats", folder: "Folder…", download: "Download", downloading: "Downloading…",
      missingEndpoint: "Configure Resolver API Endpoint in this extension's settings first.",
      invalidResponse: "The resolver returned no downloadable media URL.",
      chooseFolder: "Choose a download folder before saving.",
      complete: "Download complete", failed: "Download failed", resolverFailed: "Resolver request failed",
      foot: "This extension does not parse media sites itself. The selected URL is sent to the third-party resolver configured by the user."
    },
    zh: {
      subtitle: "第三方解析服务客户端", source: "选中的链接", loading: "正在读取配置…",
      resolving: "正在通过第三方 API 解析…", title: "标题", platform: "平台", author: "作者",
      formats: "可下载格式", folder: "目录…", download: "下载", downloading: "正在下载…",
      missingEndpoint: "请先在扩展设置中配置“解析 API 地址”。",
      invalidResponse: "第三方解析接口没有返回可下载的媒体地址。",
      chooseFolder: "请先选择下载目录。", complete: "下载完成", failed: "下载失败", resolverFailed: "第三方解析请求失败",
      foot: "本扩展自身不解析任何媒体网站；用户选中的链接会发送到用户自行配置的第三方解析服务。"
    }
  };

  function t(key) { return (strings[locale] || strings.en)[key] || strings.en[key] || key; }
  function unwrapConfig(value) {
    if (value == null) return "";
    if (typeof value === "string") return value;
    if (typeof value.result === "string") return value.result;
    return "";
  }
  function setStatus(text) {
    $("statusCard").hidden = false; $("errorCard").hidden = true;
    $("statusText").textContent = text;
  }
  function showError(message) {
    $("statusCard").hidden = true; $("resultArea").hidden = true; $("errorCard").hidden = false;
    $("errorText").textContent = message;
    resize();
  }
  function sanitizeFilename(name) {
    return String(name || "media").replace(/[\\/:*?\"<>|\u0000-\u001F]/g, "_").replace(/\s+/g, " ").trim().slice(0, 160) || "media";
  }
  function bytesLabel(value) {
    const n = Number(value || 0); if (!Number.isFinite(n) || n <= 0) return "";
    const units = ["B", "KB", "MB", "GB"]; let size = n, i = 0;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return `${size >= 100 ? size.toFixed(0) : size.toFixed(1)} ${units[i]}`;
  }
  function normalizeFormat(item, index, root) {
    if (typeof item === "string") item = { url: item };
    item = item || {};
    const url = item.url || item.download_url || item.downloadUrl || item.link || item.src;
    if (!url || !/^https?:\/\//i.test(String(url))) return null;
    const ext = String(item.ext || item.extension || item.container || root.ext || "mp4").replace(/^\./, "");
    const quality = item.quality || item.label || item.resolution || item.format || item.format_note || item.id || `Format ${index + 1}`;
    const kind = item.type || item.kind || (item.audioOnly ? "audio" : "video");
    const size = item.size || item.filesize || item.fileSize || 0;
    return { url: String(url), ext, quality: String(quality), kind: String(kind), size: Number(size) || 0, raw: item };
  }
  function normalizeResolverResponse(raw) {
    let root = raw;
    if (root && typeof root === "object" && root.data && typeof root.data === "object" && !Array.isArray(root.data)) root = root.data;
    root = root || {};
    let formats = root.formats || root.medias || root.media || root.downloads || root.links || [];
    if (!Array.isArray(formats)) formats = [formats];
    const direct = root.url || root.download_url || root.downloadUrl || root.link;
    if (direct) formats.unshift({ url: direct, quality: root.quality || "Best", ext: root.ext || root.extension });
    const normalized = formats.map((item, i) => normalizeFormat(item, i, root)).filter(Boolean);
    const seen = new Set();
    const unique = normalized.filter(f => { const key = `${f.url}|${f.quality}`; if (seen.has(key)) return false; seen.add(key); return true; });
    return {
      title: root.title || root.name || "Media",
      platform: root.platform || root.site || root.extractor || "—",
      author: root.author || root.uploader || root.creator || "—",
      formats: unique
    };
  }
  function renderResult(result) {
    $("statusCard").hidden = true; $("errorCard").hidden = true; $("resultArea").hidden = false;
    $("mediaTitle").textContent = result.title; $("platform").textContent = result.platform; $("author").textContent = result.author;
    const box = $("formats"); box.textContent = "";
    selectedFormat = result.formats[0] || null;
    result.formats.forEach((f, index) => {
      const button = document.createElement("button"); button.className = "format" + (index === 0 ? " selected" : "");
      const left = document.createElement("div");
      const title = document.createElement("div"); title.className = "format-title"; title.textContent = f.quality;
      const detail = document.createElement("div"); detail.className = "format-detail";
      detail.textContent = [f.kind, f.ext.toUpperCase(), bytesLabel(f.size)].filter(Boolean).join(" · ");
      left.append(title, detail);
      const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = f.ext.toUpperCase();
      button.append(left, badge);
      button.onclick = () => {
        selectedFormat = f;
        [...box.children].forEach(x => x.classList.remove("selected")); button.classList.add("selected");
        $("downloadButton").disabled = false;
      };
      box.appendChild(button);
    });
    $("downloadButton").disabled = !selectedFormat;
    resize();
  }
  async function resolveMedia() {
    try {
      const endpoint = unwrapConfig(await swiftBiu.storage.get("resolver_endpoint")).trim();
      const apiKey = unwrapConfig(await swiftBiu.storage.get("resolver_api_key")).trim();
      const headerName = unwrapConfig(await swiftBiu.storage.get("api_key_header")).trim() || "Authorization";
      const prefix = unwrapConfig(await swiftBiu.storage.get("api_key_prefix"));
      downloadDirectory = unwrapConfig(await swiftBiu.storage.get("download_directory")).trim();
      if (!endpoint) { showError(t("missingEndpoint")); return; }
      if (!/^https?:\/\//i.test(endpoint)) { showError("Resolver API Endpoint must be an http(s) URL."); return; }
      setStatus(t("resolving"));
      const headers = { "Content-Type": "application/json", "Accept": "application/json" };
      if (apiKey) headers[headerName] = `${prefix}${apiKey}`;
      const response = await swiftBiu.fetch(endpoint, { method: "POST", headers, body: JSON.stringify({ url: inputURL }) });
      if (!response || response.status < 200 || response.status >= 300) {
        throw new Error(`HTTP ${response ? response.status : "?"}${response && response.data ? `\n${String(response.data).slice(0, 500)}` : ""}`);
      }
      let parsed;
      try { parsed = typeof response.data === "string" ? JSON.parse(response.data) : response.data; }
      catch { throw new Error("Resolver response is not valid JSON."); }
      const result = normalizeResolverResponse(parsed);
      if (!result.formats.length) { showError(t("invalidResponse")); return; }
      renderResult(result);
    } catch (error) { showError(`${t("resolverFailed")}: ${error.message || error}`); }
  }
  async function pickFolder() {
    try {
      const result = await swiftBiu.pickLocalDirectory();
      const path = result && (result.path || result.result);
      if (path) { downloadDirectory = path; await swiftBiu.storage.set("download_directory", path).catch(() => {}); }
    } catch (error) { console.error("Folder picker failed", error); }
  }
  async function downloadSelected() {
    if (!selectedFormat) return;
    try {
      if (!downloadDirectory) { await pickFolder(); if (!downloadDirectory) { await swiftBiu.showNotification(t("chooseFolder")); return; } }
      $("downloadButton").disabled = true; $("downloadButton").textContent = t("downloading"); $("downloadProgress").hidden = false;
      const base = sanitizeFilename($("mediaTitle").textContent || "media");
      const ext = sanitizeFilename(selectedFormat.ext || "mp4").replace(/[^a-zA-Z0-9]/g, "") || "mp4";
      const filename = `${base}.${ext}`;
      const downloaded = await swiftBiu.downloadRemoteFile(selectedFormat.url, { fileName: filename, maximumBytes: 1024 * 1024 * 1024 });
      if (!downloaded || !downloaded.path) throw new Error("SwiftBiu did not return a downloaded file path.");
      const separator = downloadDirectory.endsWith("/") ? "" : "/";
      let destination = `${downloadDirectory}${separator}${filename}`;
      try {
        await swiftBiu.moveLocalFile(downloaded.path, destination);
      } catch (firstMoveError) {
        const stamp = new Date().toISOString().replace(/[-:TZ.]/g, "").slice(0, 14);
        destination = `${downloadDirectory}${separator}${base}_${stamp}.${ext}`;
        await swiftBiu.moveLocalFile(downloaded.path, destination);
      }
      await swiftBiu.showNotification(t("complete"), filename);
      $("downloadButton").textContent = t("download"); $("downloadProgress").hidden = true; $("downloadButton").disabled = false;
    } catch (error) {
      $("downloadButton").textContent = t("download"); $("downloadProgress").hidden = true; $("downloadButton").disabled = false;
      await swiftBiu.showNotification(t("failed"), error.message || String(error));
    }
  }
  function localize() {
    $("subtitle").textContent = t("subtitle"); $("sourceLabel").textContent = t("source");
    $("nameLabel").textContent = t("title"); $("platformLabel").textContent = t("platform"); $("authorLabel").textContent = t("author");
    $("formatLabel").textContent = t("formats"); $("folderButton").textContent = t("folder"); $("downloadButton").textContent = t("download");
    $("footnote").textContent = t("foot");
  }
  function resize() { setTimeout(() => swiftBiu.ui.resizeWindow({ height: Math.min(Math.max(document.body.scrollHeight + 6, 360), 720) }).catch(() => {}), 20); }

  $("folderButton").onclick = pickFolder;
  $("downloadButton").onclick = downloadSelected;

  window.swiftBiu_initialize = async function(context) {
    locale = String((context && (context.languageCode || context.locale)) || "en").toLowerCase().startsWith("zh") ? "zh" : "en";
    localize();
    inputURL = String((context && context.selectedText) || "").trim();
    $("sourceURL").textContent = inputURL || "—";
    if (!/^https?:\/\/\S+$/i.test(inputURL)) { showError("Select one complete http(s) URL."); return; }
    await resolveMedia();
  };
  window.swiftBiu_updateContext = window.swiftBiu_initialize;
})();
</script>
</body>
</html>
